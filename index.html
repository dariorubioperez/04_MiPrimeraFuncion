<!DOCTYPE html>
<html lang="es">
 <head>
    <meta charset="UTF-8" />
    <title>Mi primera función JS</title>
 </head>
 <body>
    <h1>Calcula el doble de un número</h1>
    <input type="number" id="num" placeholder="Introduce un número" />
    <button onclick="mostrarDoble()">Calcular</button>
    <p id="resultado"></p>
    <script src="script.js"></script>
    <script>
        function mostrarDoble() {
        const n = document.getElementById("num").value;
        const resultado = doble(Number(n));
        document.getElementById("resultado").textContent =
        "El doble es: " + resultado;
         }
     </script>
 </body>
</html>
